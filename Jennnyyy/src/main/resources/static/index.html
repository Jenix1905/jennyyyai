<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenny AI Assistant</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

            background:#000000;

            overflow:hidden;
        }

        .chat-container{

            width:500px;
            height:750px;

            background:rgba(0,0,0,0.45);

            backdrop-filter:blur(18px);

            border:1px solid rgba(255,255,255,0.1);

            border-radius:25px;

            overflow:hidden;

            animation:glow 3s infinite alternate;
        }

        @keyframes glow{

            from{
                box-shadow:
                        0 0 10px rgba(255,255,255,0.05);
            }

            to{
                box-shadow:
                        0 0 25px rgba(255,255,255,0.25);
            }
        }

        .header{

            background:rgba(0,0,0,0.8);

            color:white;

            padding:20px;

            text-align:center;

            font-size:22px;

            font-weight:bold;

            border-bottom:
                    1px solid rgba(255,255,255,0.1);
        }

        .chat-box{

            height:620px;

            overflow-y:auto;

            padding:20px;
        }

        .chat-box::-webkit-scrollbar{
            width:6px;
        }

        .chat-box::-webkit-scrollbar-thumb{
            background:#555;
            border-radius:10px;
        }

        .message{
            display:flex;
            margin:15px 0;
        }

        .user{
            justify-content:flex-end;
        }

        .bot{
            justify-content:flex-start;
        }

        .avatar{

            width:40px;
            height:40px;

            border-radius:50%;

            background:black;

            color:white;

            display:flex;
            justify-content:center;
            align-items:center;

            margin-right:10px;

            border:1px solid rgba(255,255,255,.2);
        }

        .bubble{

            max-width:75%;

            padding:12px 16px;

            border-radius:18px;

            word-wrap:break-word;
        }

        .user .bubble{

            background:white;

            color:black;
        }

        .bot .bubble{

            background:#1e1e1e;

            color:white;

            border:
                    1px solid rgba(255,255,255,.1);
        }

        .time{

            display:block;

            font-size:10px;

            margin-top:5px;

            opacity:0.6;
        }

        .typing{

            font-style:italic;

            opacity:0.7;
        }

        .input-area{

            display:flex;

            gap:10px;

            padding:15px;

            background:rgba(0,0,0,0.4);
        }

        input{

            flex:1;

            padding:14px;

            border:none;

            outline:none;

            border-radius:25px;

            background:#111;

            color:white;

            border:
                    1px solid rgba(255,255,255,.1);
        }

        .send{

            background:white;

            color:black;

            border:none;

            border-radius:25px;

            padding:0 25px;

            font-weight:bold;

            cursor:pointer;

            transition:0.3s;
        }

        .send:hover{

            transform:scale(1.05);
        }

    </style>

</head>
<body>

<div class="chat-container">

    <div class="header">
        🤖 Jenny AI Assistant
    </div>

    <div id="chatBox" class="chat-box">

        <div class="message bot">

            <div class="avatar">🤖</div>

            <div class="bubble">

                Hello! I'm Jenny AI. How can I help you today?

                <span class="time" id="startTime"></span>

            </div>

        </div>

    </div>

    <div class="input-area">

        <input
                type="text"
                id="message"
                placeholder="Type your message..."
        >

        <button
                class="send"
                onclick="sendMessage()">
            Send
        </button>

    </div>

</div>

<script>

    document.getElementById("startTime")
        .innerText = getCurrentTime();

    function getCurrentTime(){

        const now = new Date();

        return now.toLocaleTimeString([],{
            hour:'2-digit',
            minute:'2-digit'
        });
    }

    async function typeWriter(text){

        const chatBox =
            document.getElementById("chatBox");

        let wrapper =
            document.createElement("div");

        wrapper.className =
            "message bot";

        wrapper.innerHTML =
            `<div class="avatar">🤖</div>
             <div class="bubble"></div>`;

        chatBox.appendChild(wrapper);

        let bubble =
            wrapper.querySelector(".bubble");

        for(let i=0;i<text.length;i++){

            bubble.innerHTML += text.charAt(i);

            await new Promise(
                resolve => setTimeout(resolve,15)
            );
        }

        bubble.innerHTML +=
            `<span class="time">${getCurrentTime()}</span>`;

        chatBox.scrollTop =
            chatBox.scrollHeight;
    }

    async function sendMessage(){

        const input =
            document.getElementById("message");

        const message =
            input.value.trim();

        if(message === ""){
            return;
        }

        const chatBox =
            document.getElementById("chatBox");

        chatBox.innerHTML +=

            `<div class="message user">

                <div class="bubble">

                    ${message}

                    <span class="time">
                        ${getCurrentTime()}
                    </span>

                </div>

            </div>`;

        input.value = "";

        chatBox.scrollTop =
            chatBox.scrollHeight;

        let typing =
            document.createElement("div");

        typing.id = "typing";

        typing.className =
            "message bot";

        typing.innerHTML =

            `<div class="avatar">🤖</div>

             <div class="bubble typing">

                Jenny AI is typing...

             </div>`;

        chatBox.appendChild(typing);

        chatBox.scrollTop =
            chatBox.scrollHeight;

        try{

            let response = await fetch(
                `/chat?message=${encodeURIComponent(message)}`
            );

            let botReply =
                await response.text();

            document
                .getElementById("typing")
                .remove();

            await typeWriter(botReply);

        }
        catch(error){

            document
                .getElementById("typing")
                .remove();

            await typeWriter(
                "Unable to connect to server."
            );
        }
    }

    document
        .getElementById("message")
        .addEventListener(
            "keypress",
            function(event){

                if(event.key === "Enter"){
                    sendMessage();
                }
            }
        );

</script>

</body>
</html>
